name: Claude GitHub Integration
permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

on: 
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CLAUDE }}
        with:
          prompt: "Analyze and respond to the user's request"
